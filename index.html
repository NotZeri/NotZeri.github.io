<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Construction</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #0f172a; 
            color: #f8fafc; 
            margin: 0; 
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }
        .box { 
            background: #1e293b; 
            padding: 40px; 
            border-radius: 12px; 
            border: 2px solid #334155;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            margin: 20px;
        }
        h1 { 
            color: #f59e0b; 
            margin-top: 0;
            font-size: 2.5rem;
        }
        .icon {
            font-size: 4rem;
            margin-bottom: 10px;
            animation: pulse 2s infinite;
        }
        p {
            color: #94a3b8;
            font-size: 1.1rem;
            line-height: 1.6;
        }
        .badge-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 25px;
        }
        .badge {
            background: #334155;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            color: #38bdf8;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="icon">🚧</div>
        <h1>Under Construction</h1>
        <p>Hey! I am currently building my personal hub to share game mods, code, and other creations. Check back soon to see what I have been cooking up!</p>
        
        <div class="badge-container">
            <div class="badge">🎮 Mods</div>
            <div class="badge">🛠️ Crafts</div>
            <div class="badge">💻 Code</div>
        </div>
    </div>
</body>
</html>
