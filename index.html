<!DOCTYPE html>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #09090b;
            color: #a1a1aa;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            line-height: 1.6;
            min-height: 100vh;
        }
        a { color: inherit; text-decoration: none; }

        .wrapper {
            max-width: 640px;
            margin: 0 auto;
            padding: 120px 20px 80px;
        }

        .name {
            font-size: 32px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 6px;
            letter-spacing: -0.02em;
        }
        .subtitle {
            color: #71717a;
            font-size: 13px;
            margin-bottom: 64px;
        }

        .projects {
            margin-bottom: 64px;
        }
        .projects-label {
            font-size: 10px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: #52525b;
            margin-bottom: 16px;
        }

        .project-card {
            display: block;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 10px;
            transition: all 0.25s;
            cursor: pointer;
        }
        .project-card:hover {
            border-color: rgba(255,255,255,0.12);
            background: rgba(255,255,255,0.04);
        }
        .project-card:last-child { margin-bottom: 0; }

        .project-name {
            font-size: 16px;
            font-weight: 600;
            color: #e4e4e7;
            margin-bottom: 4px;
            letter-spacing: -0.01em;
        }
        .project-desc {
            font-size: 13px;
            color: #71717a;
            line-height: 1.6;
        }
        .project-arrow {
            float: right;
            color: #3f3f46;
            transition: color 0.25s, transform 0.25s;
            margin-top: 2px;
        }
        .project-card:hover .project-arrow {
            color: #71717a;
            transform: translateX(3px);
        }
        .project-tag {
            display: inline-block;
            margin-top: 10px;
            font-size: 10px;
            font-weight: 500;
            color: #52525b;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.04);
            padding: 2px 8px;
            border-radius: 4px;
        }

        .construction {
            text-align: center;
            padding: 48px 20px;
        }
        .construction-icon {
            width: 48px;
            height: 48px;
            margin: 0 auto 16px;
            border-radius: 12px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .construction-icon svg {
            width: 20px;
            height: 20px;
            stroke: #3f3f46;
        }
        .construction-text {
            font-size: 14px;
            color: #3f3f46;
            font-weight: 500;
        }
        .construction-sub {
            font-size: 12px;
            color: #27272a;
            margin-top: 4px;
        }

        .footer {
            margin-top: 80px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.04);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .footer-text {
            font-size: 11px;
            color: #3f3f46;
        }
        .footer-links {
            display: flex;
            gap: 16px;
        }
        .footer-links a {
            color: #3f3f46;
            transition: color 0.2s;
        }
        .footer-links a:hover {
            color: #a1a1aa;
        }
        .footer-links svg {
            width: 14px;
            height: 14px;
        }

        .fade {
            opacity: 0;
            transform: translateY(14px);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }
        .fade.show {
            opacity: 1;
            transform: translateY(0);
        }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #09090b; }
        ::-webkit-scrollbar-thumb { background: #1c1c1e; border-radius: 3px; }
    </style>
</head>

<script>
    const f = document.querySelectorAll('.fade');
    const o = new IntersectionObserver((e) => {
        e.forEach(n => {
            if (n.isIntersecting) {
                n.target.classList.add('show');
                o.unobserve(n.target);
            }
        });
    }, { threshold: 0.15 });
    f.forEach(el => o.observe(el));
</script>
